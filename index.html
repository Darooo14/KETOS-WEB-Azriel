<style>
    html {
        scroll-behavior: smooth;
    }

    #scrollProgress {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 3px;
        background: #111;
        z-index: 9999;
    }

    #particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
    }

    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: rgba(0, 0, 0, .12);
        border-radius: 50%;
        animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
        from {
            transform: translateY(110vh);
            opacity: 0;
        }

        20% {
            opacity: 1;
        }

        80% {
            opacity: 1;
        }

        to {
            transform: translateY(-10vh);
            opacity: 0;
        }
    }

    .floating-glow {
        position: fixed;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
            circle,
            rgba(0, 0, 0, .045),
            transparent 70%
        );
        transform: translate(-50%, -50%);
        z-index: 1;
    }

    .navbar,
    main,
    footer,
    .poster-section {
        position: relative;
        z-index: 2;
    }

    .hero-content {
        animation: heroTextReveal 1s ease both;
    }

    @keyframes heroTextReveal {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .photo-card {
        transform-style: preserve-3d;
    }

    .photo-card .number {
        transform: translateZ(35px);
    }

    .tilt-card {
        transform-style: preserve-3d;
        will-change: transform;
    }

    .tilt-photo {
        transform-style: preserve-3d;
        will-change: transform;
    }

    .hero-button,
    .share-button {
        position: relative;
        overflow: hidden;
    }

    .hero-button::after,
    .share-button::after {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 70%;
        height: 100%;
        background: linear-gradient(
            110deg,
            transparent,
            rgba(255, 255, 255, .25),
            transparent
        );
        transform: skewX(-20deg);
        animation: buttonShine 4.5s ease-in-out infinite;
    }

    @keyframes buttonShine {
        0%, 65% {
            left: -120%;
        }

        80%, 100% {
            left: 140%;
        }
    }

    .ripple {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, .4);
        transform: translate(-50%, -50%);
        animation: rippleEffect .65s ease-out forwards;
        pointer-events: none;
    }

    @keyframes rippleEffect {
        from {
            width: 10px;
            height: 10px;
            opacity: .8;
        }

        to {
            width: 400px;
            height: 400px;
            opacity: 0;
        }
    }

    .support-thanks {
        transform-style: preserve-3d;
    }

    .section-inner {
        position: relative;
        z-index: 2;
    }

    @media (max-width: 700px) {
        .floating-glow {
            display: none;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: .01ms !important;
            transition-duration: .01ms !important;
        }
    }
</style>
